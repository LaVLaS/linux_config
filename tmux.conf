
# Tell tmux to update the wayland environment variables to fix sway errors due to a stale $SWAYSOCK env var after a logoff/logon
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK SSH_AUTH_SOCK"

# Lookup for tmux status
set -g status-position top

set -g default-terminal "screen-256color"

# We aren't filling up this history buffer...hopefully
set -g history-limit 100000

# Setting the escape time really low so that neovim can get us back to normal node faster
set -g escape-time 10

# Ctrl+b is derp. Long live Alt+A
unbind C-b
set -g prefix M-a
bind-key M-a send-prefix

# Set the default shell that tmux uses for all new panes
set -g default-shell /usr/bin/fish

# Window/Pane dressing
#set -g pane-border-style fg=colour17
set -g pane-border-style fg=default
set -g pane-active-border-style fg=black,bg=white,bold

set -g mouse on
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
#bind -n WheelDownPane select-pane -t= \; send-keys -M
#bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
#bind -n MouseDown1Pane select-pane -t=

#tmux will resize the window to the size of the smallest session for which it is the current window, rather than the smallest session to which it is attached.
set-window-option -g aggressive-resize

set-window-option -g allow-rename off

#set-option repeat-time 1000
bind-key c new-window -c "#{pane_current_path}"
bind-key ` new-window -c "#{pane_current_path}" toolbox enter
bind-key H split-window -c "#{pane_current_path}" toolbox enter
bind-key '"' split-window -c "#{pane_current_path}"
bind-key T split-window -h -c "#{pane_current_path}" toolbox enter
bind-key % split-window -h -c "#{pane_current_path}"

# Enable Vim controls for copy mode and status line
set-window-option -g mode-keys vi
set -g status-keys vi

#Select tmux pane using Vim style movement w/o vim split integration
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

#Try to integrate vim/tmux split/pane movement into the same command
#Requires vim plugin: christoomey/vim-tmux-navigator
#is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
#bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
#bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
#bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
#bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
#bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

#bind C-l send-keys 'C-l'
#bind C-k send-keys 'C-k'

bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-h resize-pane -L 5
bind-key -r M-l resize-pane -R 5

# visual notification of activity in other windows
set-window-option -g monitor-activity off

####################
#### STATUS BAR
####################
# Style derived from see https://github.com/sbernheim4/dotfiles/blob/master/.tmux.conf
# Refresh status line every 5 seconds - Good for when music is playing / update time etc
set -g status-interval 5

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

set-option -g status "on"

# Default statusbar color
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1

# Default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# Active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1

# Set active pane border color
set-option -g pane-active-border-style fg=colour214

# Set inactive pane border color
set-option -g pane-border-style fg=colour239

# Message info
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# Writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# Pane number display
set-option -g display-panes-active-colour colour1 #fg2
set-option -g display-panes-colour colour237 #bg1

# Clock
set-window-option -g clock-mode-colour colour109 #blue

# Bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg
#set-option -g status-left "\
##[fg=colour7, bg=colour241]#{?client_prefix,#[bg=colour167],} ❐ #S \
